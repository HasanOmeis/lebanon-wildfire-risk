# pytest settings for the project (comments must be on their own lines in this file)
[pytest]
# only look for tests inside the tests/ folder (src/final_test.py is a script, not a test)
testpaths = tests
# hide one known notice from Starlette's TestClient (httpx -> httpx2); matched by message, since it uses its own warning class
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient.